# cargo-deny: known advisories, licenses, crate sources. CI runs
# `cargo deny check` (security.yml).

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it is listed here, with why.
# ci.yml's `cargo audit` names the same ids; change both together.
ignore = [
  # chrono and humantime are marked unmaintained: no vulnerability and no
  # fixed version. object_store, the cloud reader, needs both at its latest
  # (0.14.2); compara itself uses chrono only to stamp the JSON summary with
  # the local time. Accepted by the maintainer, 2026-11-17, until
  # object_store moves off them.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; needed by object_store 0.14.2 and the summary's local timestamp" },
  { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; needed by object_store 0.14.2" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "Unlicense", "0BSD", "BSD-3-Clause", "BSD-2-Clause", "ISC", "CDLA-Permissive-2.0", "BSL-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
