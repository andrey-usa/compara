name: ci

on:
  # next is where the work lands; main moves at a release.
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:
    inputs:
      perf_base:
        description: "a release tag: run perf-gate against it (the release gate does, on the commit to release)"
        default: ""

permissions:
  contents: read

# A newer push to a branch replaces the run of the one before it; a
# dispatch on the same commit runs beside it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The rustc rust-toolchain.toml names, with its rustfmt and clippy.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          # No cache from a job that stopped early. A key, once saved, is
          # kept until the dependencies change, so a job cancelled by a newer
          # push or failed mid-build would leave a target with nothing in it
          # for every later run of that key: the Windows test job rebuilt
          # its 151 dependencies on every push, 8 min of its 9, under a
          # 70 MB "cache hit" (ci 42918357807, 43070419956).
          cache-on-failure: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: python3 -m py_compile scripts/*.py packaging/*.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # About four times the slowest of them (Windows, 6.5 minutes with the
    # dependencies cached under [profile.release]; the `ci` profile in
    # Cargo.toml is measured by the first runs of this job).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache-on-failure: false
          # The keys from before cache-on-failure may hold that partial build.
          # The Linux x86-64 build has debug assertions (below): a key of its
          # own, so neither build is restored for the other.
          cache-key: whole${{ matrix.os == 'ubuntu-24.04' && '-debug-assertions' || '' }}
      - run: cargo test --locked --profile ci
        env:
          # The `ci` profile inherits release, which compiles `debug_assert!`
          # out: the bounds the vector scans assert before each unaligned
          # load, and std's checks of `get_unchecked`, `from_raw_parts`,
          # `copy_nonoverlapping` and `set_len`, which follow the same
          # switch. One leg, the fastest, runs the suite with them on, so a
          # broken bound fails a test there by its assertion. Every leg runs
          # the scans' tests on bytes against an unreadable page, which
          # fault on an over-read with or without them.
          CARGO_PROFILE_CI_DEBUG_ASSERTIONS: ${{ matrix.os == 'ubuntu-24.04' }}

  # A small end-to-end run: generate a pair, compare it with every engine,
  # require identical counts and column statistics, and check the report
  # needs nothing from the network.
  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache-on-failure: false
      - run: cargo build --locked --release --all-features
      - name: Generate 200k rows a side
        run: ./target/release/compara-gen-data --rows 200k --out-dir data
      - name: Every engine gives the same answer
        run: |
          for e in turbo sortmerge native; do
            code=0
            ./target/release/compara compare data/200k_a.csv data/200k_b.csv \
              -k account_id,txn_id -i updated_at --engine $e \
              -o /tmp/$e.html --json /tmp/$e.json || code=$?
            [ "$code" = 1 ] || { echo "::error::$e exited $code, expected 1 (differences found)"; exit 1; }
          done
          python3 - <<'PY'
          import json, sys
          engines = ["turbo", "sortmerge", "native"]
          ref = json.load(open(f"/tmp/{engines[0]}.json"))
          for e in engines[1:]:
              n = json.load(open(f"/tmp/{e}.json"))
              for section in ("counts", "columns"):
                  if n[section] != ref[section]:
                      sys.exit(f"{e} {section} differ from {engines[0]}: {n[section]} vs {ref[section]}")
          print(f"all {len(engines)} engines agree:", json.dumps(ref["counts"]))
          PY
      - name: The report is self-contained
        run: |
          python3 - <<'PY'
          import re, sys
          html = open("/tmp/turbo.html", encoding="utf-8").read()
          external = re.search(r'(?:src|href)="(?!#)([^"]+)"', html)
          if external:
              sys.exit(f"report references an external resource: {external.group(1)}")
          print(f"report: {len(html) // 1024} KB, no external references")
          PY
      - name: Benchmark harness, 10k rows
        run: ./target/release/compara-bench --rows 10k --engine turbo --out-dir bench

  # The work a comparison takes, held to a base: instructions counted by
  # valgrind (exact, so a busy runner can't move them) on fixed files at two
  # sizes, for each engine, and on 200k rows of NDJSON written compactly and
  # as Python's json.dumps spaces it. Fails on more than 5% over the base, on
  # a cost that grows faster than the rows, or on spaced NDJSON costing over
  # 1.1 times the compact (scripts/perf_gate.py). The base is the
  # pull request's; on a push to next the latest release, so a slowdown
  # shows at the commit that brought it; on a dispatch the tag in perf_base.
  perf-gate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'next') || inputs.perf_base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          cache-on-failure: false
      - uses: ./.github/actions/apt-install
        with:
          packages: valgrind
      - name: Build the head and the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.perf_base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "base: $BASE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          cargo build --locked --release --bin compara --bin compara-gen-data
          mkdir -p gate
          cp target/release/compara gate/head
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          # The base is a released tree: a warning a newer cargo has for
          # it (1.100: `homepage` repeating `documentation`) can't be
          # fixed there, so it is not denied there. Built from here, it
          # takes the head's rust-toolchain.toml: one compiler for both,
          # so the gate measures the code.
          CARGO_BUILD_WARNINGS=warn cargo build --locked --release --bin compara \
            --manifest-path "$RUNNER_TEMP/base/Cargo.toml" --target-dir target
          cp target/release/compara gate/base
          # A base that names another rustc: the head built by that one
          # too, so the summary shows what the compiler alone moves.
          channel() { sed -n 's/^channel = "\(.*\)"/\1/p'; }
          old=$(git show "$BASE_SHA:rust-toolchain.toml" 2>/dev/null | channel || true)
          if [ -n "$old" ] && [ "$old" != "$(channel < rust-toolchain.toml)" ]; then
            rustup toolchain install "$old" --profile minimal --no-self-update
            cargo +"$old" build --locked --release --bin compara --target-dir "$RUNNER_TEMP/target-old"
            cp "$RUNNER_TEMP/target-old/release/compara" gate/head-old
          fi
      - name: Files of 50k and 200k rows a side
        run: |
          ./target/release/compara-gen-data --rows 200k --out-dir gate
          for s in a b; do head -n 50001 "gate/200k_$s.csv" > "gate/50k_$s.csv"; done
          ./target/release/compara-gen-data --rows 200k --format ndjson --out-dir gate
          # The same rows as json.dumps writes them by default: `, ` and `: `.
          python3 - gate/200k_a.ndjson gate/200k_b.ndjson <<'PY'
          import json, sys
          for path in sys.argv[1:]:
              out = path.replace("200k_", "200ksp_")
              with open(path, encoding="utf-8") as src, open(out, "w", encoding="utf-8") as dst:
                  for line in src:
                      dst.write(json.dumps(json.loads(line)) + "\n")
          PY
      - name: Gate
        run: |
          files=(--small gate/50k_a.csv gate/50k_b.csv --large gate/200k_a.csv gate/200k_b.csv
            --json gate/200k_a.ndjson gate/200k_b.ndjson --json-spaced gate/200ksp_a.ndjson gate/200ksp_b.ndjson)
          python3 scripts/perf_gate.py --head gate/head --base gate/base \
            --counter cachegrind --require "${files[@]}" \
            -- -k account_id,txn_id -i updated_at | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          # Not a bound: a new rustc is taken or not on its own measure.
          if [ -x gate/head-old ]; then
            printf '\n%s\n\n' "The compiler alone: this head built by the base's rustc (base) and by its own (head)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            python3 scripts/perf_gate.py --head gate/head --base gate/head-old \
              --counter cachegrind --require "${files[@]}" \
              -- -k account_id,txn_id -i updated_at | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

  # Known-vulnerable dependencies (RustSec advisory database).
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit
      # The advisories deny.toml lists, for the reasons it gives.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2026-0543 --ignore RUSTSEC-2026-0542

  # The oldest Rust that builds compara (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      # A toolchain named here is set as the checkout's override, which
      # rustup puts before rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-on-failure: false
      - run: cargo check --locked --all-targets
