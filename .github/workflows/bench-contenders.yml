name: bench-contenders

# Weekly: compara against DuckDB, Polars, qsv (CSV only) and ClickHouse (unique
# keys only) at their latest, on one keyed comparison of two generated 20-column
# tables (1M and 10M rows): the headline pairs have no key twice in a file, in CSV
# and in Parquet as compara-gen-data, Polars and DuckDB each write it; the pairs
# that repeat 0.01% of their keys (CSV, and compara-gen-data's Parquet) are a table
# of their own. Every tool's counts are checked identical (correctness gate). The
# results are printed as `bench json` notices, so the docs are written from
# the run itself: scripts/gen_bench_docs.py <run id> --readme README.md
# --page docs/benchmarks.md --losses docs/losses.md.

on:
  workflow_dispatch:
    inputs:
      measure:
        description: "contenders (the weekly comparison) or changes (the timings a version's CHANGELOG quotes, against the last release: scripts/bench_changes.py)"
        default: "contenders"
      base:
        description: "changes: the last release's tag, the build every claim is measured against"
        default: "v0.7.0"
      lookup_base:
        description: "changes: a commit before the column-name lookup (206d6ba), the -c claim's base, as the release refuses that table"
        default: "793475a"
      rows:
        description: "changes: rows a side for the sortmerge claim (compara-gen-data: 1m, 10m)"
        default: "10m"
      runs:
        description: "changes: rounds; each number is the median"
        default: "5"
  schedule:
    # Weekly contender check, staggered after navigera/gruppera.
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  compare:
    if: inputs.measure != 'changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Build compara (release)
        run: cargo build --release --locked --bin compara --bin compara-gen-data

      - name: Install contenders (latest)
        run: |
          pip install --upgrade duckdb polars
          python3 -c "import duckdb, polars; print('duckdb', duckdb.__version__, 'polars', polars.__version__)"

      # qsv (dathere/qsv): its release binary at the latest release, the tag and
      # `qsv --version` printed so the run records what was measured.
      - name: Install qsv (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo dathere/qsv --json tagName --jq .tagName)
          mkdir -p "$RUNNER_TEMP/qsv"
          gh release download "$tag" --repo dathere/qsv --pattern 'qsv-*-x86_64-unknown-linux-gnu.zip' --dir "$RUNNER_TEMP/qsv"
          ls "$RUNNER_TEMP/qsv"/qsv-*-x86_64-unknown-linux-gnu.zip | wc -l | grep -qx 1
          unzip -q -o "$RUNNER_TEMP/qsv"/qsv-*-x86_64-unknown-linux-gnu.zip qsv -d "$RUNNER_TEMP/qsv"
          chmod +x "$RUNNER_TEMP/qsv/qsv"
          echo "qsv release $tag"
          "$RUNNER_TEMP/qsv/qsv" --version

      # ClickHouse: its official release binary (clickhouse-common-static) at the
      # latest release, the tag and `clickhouse local --version` printed.
      - name: Install ClickHouse (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo ClickHouse/ClickHouse --json tagName --jq .tagName)
          version=${tag#v}; version=${version%-*}
          mkdir -p "$RUNNER_TEMP/clickhouse"
          gh release download "$tag" --repo ClickHouse/ClickHouse --pattern "clickhouse-common-static-$version-amd64.tgz" --dir "$RUNNER_TEMP/clickhouse"
          tar -xzf "$RUNNER_TEMP/clickhouse/clickhouse-common-static-$version-amd64.tgz" -C "$RUNNER_TEMP/clickhouse" --strip-components 3 "clickhouse-common-static-$version/usr/bin/clickhouse"
          rm "$RUNNER_TEMP/clickhouse/clickhouse-common-static-$version-amd64.tgz"
          echo "clickhouse release $tag"
          "$RUNNER_TEMP/clickhouse/clickhouse" local --version

      # Each tool in a cgroup of 13 GB of the runner's 16: a tool that needs
      # more is stopped and recorded as out of memory, and the runner lives.
      # Every run starts with its inputs in a stated page-cache state, warm
      # and cold, so what one tool leaves in memory does not decide how fast
      # the next one reads; each tool's number is its median of five.
      - name: Benchmark (1M and 10M rows, unique and repeated keys, CSV and three Parquet writers, five rounds, warm and cold)
        run: |
          python3 scripts/bench_contenders.py --compara target/release/compara \
            --gen target/release/compara-gen-data --qsv "$RUNNER_TEMP/qsv/qsv" \
            --clickhouse "$RUNNER_TEMP/clickhouse/clickhouse" --rows 1m,10m --runs 5 --cache warm,cold \
            --work "$RUNNER_TEMP/bench" --delete --memory-max 13G --json bench-results.json

      # GitHub keeps 10 notices a step: the results go out in steps of ten.
      - name: Results as notices (1-10)
        run: python3 scripts/bench_contenders.py --notices-of bench-results.json --notice-step 1
      - name: Results as notices (11-20)
        run: python3 scripts/bench_contenders.py --notices-of bench-results.json --notice-step 2
      - name: Results as notices (21-30)
        run: python3 scripts/bench_contenders.py --notices-of bench-results.json --notice-step 3

      - name: Publish table
        run: |
          python3 scripts/gen_bench_docs.py bench-results.json --page bench-page.md
          cat bench-page.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-contenders-results
          path: bench-results.json

  # zstd inputs (#11): .csv.zst and zstd Parquet from two writers, against
  # DuckDB 1.x and 2.x, every tool's counts checked against the others.
  zstd:
    if: inputs.measure != 'changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Benchmark
        run: |
          python3 scripts/bench_zstd.py --rows 10m --runs 3 --baseline origin/main --work "$RUNNER_TEMP/bench" | tee /tmp/zstd-table.md
          { echo "## bench-contenders — zstd inputs (10M rows x 20 cols)"; sed -n '/^Linux/,$p' /tmp/zstd-table.md; } >> "$GITHUB_STEP_SUMMARY"

  # By hand only (measure: changes): the timings a version's CHANGELOG quotes for
  # what changed since the last release, this commit against the release's own
  # binary, each from a stated page-cache state, medians with their range, printed
  # as `bench json` notices so the CHANGELOG can cite this run. Here rather than in
  # a workflow of its own because GitHub dispatches only workflows the default
  # branch has.
  changes:
    if: inputs.measure == 'changes'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: bench-changes-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      # The escaped-name claim is an instruction count (cachegrind), as the perf gate's.
      - uses: ./.github/actions/apt-install
        with:
          packages: valgrind

      # One target directory for the three builds, so the dependencies (the same
      # versions in each) are compiled once; each binary is copied out before the
      # next build replaces it. Each is built from its own checkout of the commit.
      - name: Build head, the release and the commit before the lookup
        env:
          BASE: ${{ inputs.base }}
          LOOKUP_BASE: ${{ inputs.lookup_base }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cargo build --release --locked --bin compara --bin compara-gen-data
          cp "$CARGO_TARGET_DIR/release/compara" "$bin/head"
          cp "$CARGO_TARGET_DIR/release/compara-gen-data" "$bin/gen"
          for pair in "base:$BASE" "lookup-base:$LOOKUP_BASE"; do
            name=${pair%%:*}; ref=${pair#*:}
            git worktree add --detach "$RUNNER_TEMP/src-$name" "$ref"
            (cd "$RUNNER_TEMP/src-$name" && cargo build --release --locked --bin compara)
            cp "$CARGO_TARGET_DIR/release/compara" "$bin/$name"
            echo "$name: $ref $(git -C "$RUNNER_TEMP/src-$name" rev-parse HEAD)"
          done
          echo "head: $(git rev-parse HEAD)"

      # The sortmerge claim runs every tool in a cgroup of 512 MB (systemd-run, as
      # bench-contenders does), its inputs dropped from the page cache before each run.
      # The stall and put claims wait on timers over loopback (tests/object_server.py):
      # three rounds, a run killed at 150 s.
      - name: Measure
        env:
          ROWS: ${{ inputs.rows }}
          RUNS: ${{ inputs.runs }}
        run: |
          python3 scripts/bench_changes.py --head "$RUNNER_TEMP/bin/head" --base "$RUNNER_TEMP/bin/base" \
            --lookup-base "$RUNNER_TEMP/bin/lookup-base" --gen "$RUNNER_TEMP/bin/gen" \
            --rows "$ROWS" --memory 512M --runs "$RUNS" --work "$RUNNER_TEMP/bench" --delete \
            --json bench-changes.json --notices

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-changes-results
          path: bench-changes.json
