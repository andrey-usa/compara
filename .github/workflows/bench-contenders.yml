name: bench-contenders

# Weekly: compara against DuckDB and Polars at their latest, on one keyed
# comparison of two generated 20-column tables (1M and 10M rows, CSV and
# Parquet), every tool's counts checked identical (correctness gate). The
# results are printed as `bench json` notices, so the docs are written from
# the run itself: scripts/gen_bench_docs.py <run id> --readme README.md
# --page docs/benchmarks.md --losses docs/losses.md.

on:
  workflow_dispatch:
  schedule:
    # Weekly contender check, staggered after navigera/gruppera.
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Build compara (release)
        run: cargo build --release --locked --bin compara --bin compara-gen-data

      - name: Install contenders (latest)
        run: |
          pip install --upgrade duckdb polars
          python3 -c "import duckdb, polars; print('duckdb', duckdb.__version__, 'polars', polars.__version__)"

      - name: Benchmark (1M and 10M rows, CSV and Parquet, three rounds)
        run: |
          python3 scripts/bench_contenders.py --compara target/release/compara \
            --gen target/release/compara-gen-data --rows 1m,10m --runs 3 \
            --work "$RUNNER_TEMP/bench" --delete --json bench-results.json --notices

      - name: Publish table
        run: |
          python3 scripts/gen_bench_docs.py bench-results.json --page bench-page.md
          cat bench-page.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-contenders-results
          path: bench-results.json

  # zstd inputs (#11): .csv.zst and zstd Parquet from two writers, against
  # DuckDB 1.x and 2.x, every tool's counts checked against the others.
  zstd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Benchmark
        run: |
          python3 scripts/bench_zstd.py --rows 10m --runs 3 --baseline origin/main --work "$RUNNER_TEMP/bench" | tee /tmp/zstd-table.md
          { echo "## bench-contenders — zstd inputs (10M rows x 20 cols)"; sed -n '/^Linux/,$p' /tmp/zstd-table.md; } >> "$GITHUB_STEP_SUMMARY"
