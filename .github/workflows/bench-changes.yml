name: bench-changes

# By hand: the timings a version's CHANGELOG quotes for what changed since the last
# release, this commit against the release's own binary, each from a stated page-cache
# state, medians of five with their range, printed as `bench json` notices so the
# CHANGELOG can cite this run: scripts/bench_changes.py says what each claim is. A
# workflow of its own because bench-contenders runs weekly and on every dispatch,
# and its jobs would run again for a measurement that is wanted once a release.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "the last release's tag, the build every claim is measured against"
        default: "v0.7.0"
      lookup_base:
        description: "a commit before the column-name lookup (206d6ba): the -c claim's base, as the release refuses that table"
        default: "793475a"
      rows:
        description: "rows a side for the sortmerge claim (compara-gen-data: 1m, 10m)"
        default: "10m"
      runs:
        description: "rounds; each number is the median"
        default: "5"

permissions:
  contents: read

concurrency:
  group: bench-changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      # One target directory for the three builds, so the dependencies (the same
      # versions in each) are compiled once; each binary is copied out before the
      # next build replaces it. Each is built from its own checkout of the commit.
      - name: Build head, the release and the commit before the lookup
        env:
          BASE: ${{ inputs.base }}
          LOOKUP_BASE: ${{ inputs.lookup_base }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cargo build --release --locked --bin compara --bin compara-gen-data
          cp "$CARGO_TARGET_DIR/release/compara" "$bin/head"
          cp "$CARGO_TARGET_DIR/release/compara-gen-data" "$bin/gen"
          for pair in "base:$BASE" "lookup-base:$LOOKUP_BASE"; do
            name=${pair%%:*}; ref=${pair#*:}
            git worktree add --detach "$RUNNER_TEMP/src-$name" "$ref"
            (cd "$RUNNER_TEMP/src-$name" && cargo build --release --locked --bin compara)
            cp "$CARGO_TARGET_DIR/release/compara" "$bin/$name"
            echo "$name: $ref $(git -C "$RUNNER_TEMP/src-$name" rev-parse HEAD)"
          done
          echo "head: $(git rev-parse HEAD)"

      # The sortmerge claim runs every tool in a cgroup of 512 MB (systemd-run, as
      # bench-contenders does), its inputs dropped from the page cache before each run.
      - name: Measure
        env:
          ROWS: ${{ inputs.rows }}
          RUNS: ${{ inputs.runs }}
        run: |
          python3 scripts/bench_changes.py --head "$RUNNER_TEMP/bin/head" --base "$RUNNER_TEMP/bin/base" \
            --lookup-base "$RUNNER_TEMP/bin/lookup-base" --gen "$RUNNER_TEMP/bin/gen" \
            --rows "$ROWS" --memory 512M --runs "$RUNS" --work "$RUNNER_TEMP/bench" --delete \
            --json bench-changes.json --notices

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-changes-results
          path: bench-changes.json
