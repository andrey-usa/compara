name: Bug report
description: Something compara did that it should not have, or did not do.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to see it
      description: The command, what it printed, and its exit code; if you can, two small files that show it.
      render: text
      placeholder: compara compare a.csv b.csv -k id
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What `compara --version` prints.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
